<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlanetForge</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block;touch-action:none;cursor:pointer}
  #info{position:fixed;left:16px;right:16px;bottom:28px;text-align:center;pointer-events:none;text-shadow:0 2px 8px #000}
  #name{font-size:clamp(28px,6vw,52px);font-weight:700;letter-spacing:.06em}
  #meta{opacity:.7;font-size:14px;margin-top:4px}
  #seed{opacity:.4;font-size:12px;margin-top:2px;word-break:break-all}
  #hint{position:fixed;top:14px;left:0;right:0;text-align:center;opacity:.45;font-size:13px;pointer-events:none}
  #fade{position:fixed;inset:0;background:#000;opacity:0;transition:opacity 1s;pointer-events:none}
</style>
<!-- three.js r170 is bundled in lib/ so the page also works offline (e.g. as a Wallpaper Engine wallpaper) -->
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head>
<body>
<div id="hint">click for a new world · drag to spin · scroll to zoom</div>
<div id="info"><div id="name"></div><div id="meta"></div><div id="seed"></div></div>
<div id="fade"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './lib/OrbitControls.js';

// 3D simplex noise, Ashima Arts / Stefan Gustavson (MIT)
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
// fbm with level of detail: keeps adding finer octaves until they'd be smaller than a pixel,
// so detail stays sharp at any zoom. gPx = pixel footprint on the unit sphere, set at the top of main();
// s = how much the caller scaled p.
float gPx=0.;
float fbm(vec3 p, float s){
  float sum=0., a=.5, px=gPx*s;
  for(int i=0;i<12;i++){
    float w=1.-smoothstep(.25,.5,px);   // fade the last octave in instead of popping
    if(w<=0.) break;
    sum+=a*w*snoise(p); p=p*2.03+1.7; px*=2.03; a*=.5;
  }
  return sum;
}
// ridged fbm: sharp mountain chains instead of round hills
float ridged(vec3 p, float s){
  float sum=0., a=.5, px=gPx*s;
  for(int i=0;i<12;i++){
    float w=1.-smoothstep(.25,.5,px);
    if(w<=0.) break;
    float n=1.-abs(snoise(p)); sum+=a*w*n*n; p=p*2.03+1.7; px*=2.03; a*=.5;
  }
  return sum;
}
vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return fract(sin(p)*43758.5453);}
// one crater per grid cell: a bowl with a raised rim
float craters(vec3 p){
  vec3 i=floor(p), f=fract(p); float h=0.;
  for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
    vec3 g=vec3(x,y,z), o=hash3(i+g);
    float d=length(g+o-f)/(.2+.3*o.x);
    h+=d<1.?(d*d-1.)*.5:0.;
    h+=.2*exp(-(d-1.)*(d-1.)*30.);
  }
  return h;
}
`;

// ring density as a function of t (0 = inner edge, 1 = outer edge); shared by the ring itself,
// the shadow it casts on the planet and clouds, and the ring particles, so their gaps all line up
const RINGFN = `
float h1(float x){return fract(sin(x*127.1)*43758.5);}
float n1(float x){float i=floor(x);return mix(h1(i),h1(i+1.),smoothstep(0.,1.,fract(x)));}
float ringBands(float t, vec3 K){ return n1(t*K.x)*.5+n1(t*K.y+9.)*.3+n1(t*K.z+3.)*.2; }
float ringAlpha(float t, float b, vec2 gaps, float dust){
  float gap=smoothstep(.0,.03,abs(t-gaps.x))*smoothstep(.0,.015,abs(t-gaps.y));   // Cassini-style gaps
  return clamp(b*1.5-.1,0.,1.)*gap*smoothstep(0.,.04,t)*(1.-smoothstep(.9,1.,t))*.9*dust;
}
// fraction of sunlight blocked by the ring for point p (planet-local; ring lies in the y=0 plane)
uniform float uRinged,uRIn,uROut,uRDust; uniform vec3 uRK; uniform vec2 uRGaps;
float ringShadow(vec3 p, vec3 sun){
  if(uRinged<.5 || abs(sun.y)<.001) return 0.;
  float d=-p.y/sun.y;
  if(d<=0.) return 0.;
  float rt=(length((p+sun*d).xz)-uRIn)/(uROut-uRIn);
  return ringAlpha(rt,ringBands(rt,uRK),uRGaps,uRDust);
}
`;
const ringUniforms = () => ({ uRinged:{value:0}, uRIn:{value:1.4}, uROut:{value:2.2}, uRDust:{value:1},
  uRK:{value:new THREE.Vector3()}, uRGaps:{value:new THREE.Vector2()} });

const VERT = `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const col3 = () => ({value:new THREE.Color()});
const num = v => ({value:v});

// one material for planets and moons; clone() gives each body its own uniforms
const bodyMat = new THREE.ShaderMaterial({
  uniforms: {
    uSeed:{value:new THREE.Vector3()}, uFreq:num(1), uSea:num(0), uIce:num(.8), uLava:num(0),
    uGas:num(0), uBands:num(10), uCity:num(0), uCrater:num(0), uTime:num(0),
    uWarp:num(0), uRidge:num(0), uTerrace:num(0), uLocked:num(0), uGlow:num(0), uMoist:num(0),
    uTurb:num(2), uStorms:num(1), uSharp:num(0),
    uDeep:col3(), uShallow:col3(), uSand:col3(), uLow:col3(), uLow2:col3(), uHigh:col3(), uRock:col3(), uSnow:col3(), uAtmo:col3(),
    uSun:{value:new THREE.Vector3()}, uSunCol:col3(), uCam:{value:new THREE.Vector3()}, ...ringUniforms(),
  },
  vertexShader: VERT,
  fragmentShader: NOISE + RINGFN + `
  uniform vec3 uSeed,uDeep,uShallow,uSand,uLow,uLow2,uHigh,uRock,uSnow,uAtmo,uSun,uSunCol,uCam;
  uniform float uFreq,uSea,uIce,uLava,uGas,uBands,uCity,uCrater,uTime,uWarp,uRidge,uTerrace,uLocked,uGlow,uMoist,uTurb,uStorms,uSharp;
  varying vec3 vPos;
  float height(vec3 p){
    vec3 q=p*uFreq+uSeed;
    // swirled continents: broad, gentle warp, so features bend without being smeared into streaks
    if(uWarp>0.) q+=uWarp*vec3(snoise(q*.3+1.3),snoise(q*.3+7.1),snoise(q*.3+13.7));
    float h=fbm(q,uFreq);
    if(uRidge>0.) h=mix(h,ridged(q*1.3,uFreq*1.3)-.35,uRidge);                           // mountain chains
    if(uTerrace>0.){ float s=h*7.; h=mix(h,(floor(s)+smoothstep(0.,.25,fract(s)))/7.,uTerrace); }   // mesas & steps
    h*=1.-.5*uCrater;
    if(uCrater>0.) h+=uCrater*(craters(p*2.5+uSeed)*.7+craters(p*6.+uSeed.yzx)*.35+craters(p*14.+uSeed.zxy)*.12);
    return h;
  }
  void main(){
    vec3 p=normalize(vPos), n=p, col;
    gPx=length(fwidth(p));
    float water=0., t=0., ice=0.;
    if(uGas>.5){
      // banded gas giant: turbulent band edges, fine streaks and up to three storms
      float b=p.y*uBands+fbm(p*vec3(2.,7.,2.)+uSeed,7.)*uTurb;
      float s=sin(b);
      col=mix(uLow,uHigh,mix(s*.5+.5,smoothstep(-.25,.25,s),uSharp));
      col=mix(col,uRock,smoothstep(.3,.9,sin(b*.37+uSeed.x)*.5+.5)*.6);
      col*=.9+.2*snoise(p*vec3(3.,16.,3.)+uSeed.zxy);
      for(int i=0;i<3;i++){
        if(float(i)>=uStorms) break;
        vec3 sh=hash3(uSeed+float(i)*7.3);
        vec3 sd=normalize(vec3(cos(sh.x*6.283),(sh.y-.5)*1.2,sin(sh.x*6.283)));
        float sz=.06+.14*sh.z, d=length((p-sd)*vec3(1.,2.4,1.))+snoise(p*9.+uSeed+float(i))*.04;
        col=mix(col,i==0?uSnow:mix(uSnow,uHigh,.5),1.-smoothstep(sz*.6,sz,d));
      }
    } else {
      float h=height(p);
      vec3 t1=normalize(cross(p, abs(p.y)<.99?vec3(0,1,0):vec3(1,0,0))), t2=cross(p,t1);
      water=step(h,uSea);
      float depth=uSea-h;
      if(water<.5){   // bump-map land from the height gradient
        float e=max(gPx*.7,.00005), hx=height(normalize(p+t1*e)), hy=height(normalize(p+t2*e));
        n=normalize(p-(t1*(hx-h)+t2*(hy-h))/e*.06);
      } else {        // moving waves: noise scales that fade out once smaller than a pixel
        vec3 g=vec3(0.);
        for(int k=0;k<3;k++){
          float wf=70.*pow(4.,float(k)), fade=1.-smoothstep(.1,.45,gPx*wf);
          if(fade<=0.) break;
          vec3 q=p*wf+uSeed+uTime*vec3(.13,.08,.11)*float(k+1);
          float w0=snoise(q);
          g+=(t1*(snoise(q+t1*.3)-w0)+t2*(snoise(q+t2*.3)-w0))/.3*fade*.06/float(k+1);
        }
        n=normalize(p-g);
      }
      t=clamp((h-uSea)/(.65-uSea),0.,1.);
      col=mix(uShallow,uDeep,smoothstep(0.,.3,depth));
      col=mix(col,uShallow*1.6,1.-smoothstep(0.,.035,depth));            // bright coastal shallows
      float foam=(1.-smoothstep(0.,.012,depth))*smoothstep(-.1,.5,snoise(p*180.+uSeed+uTime*.4));
      col=mix(col,vec3(.85),foam*water*.7*(1.-uLava));                    // surf on the shoreline
      // snow/ice texture: drifts and blue-grey tones, plus thin pressure cracks once they're big enough to see
      float iceN=fbm(p*12.+uSeed.zyx,12.);
      vec3 snowCol=mix(uSnow,uSnow*vec3(.8,.89,1.),smoothstep(-.1,.5,iceN));
      float crack=pow(1.-abs(snoise(p*35.+uSeed)),14.)*(1.-smoothstep(.2,.5,gPx*35.));
      snowCol*=1.-crack*.4;
      float slope=1.-dot(n,p);                     // 0 on flat ground
      float moist=snoise(p*2.3+uSeed.yxz)*.65+snoise(p*6.+uSeed)*.35;   // biome patches: wet vs dry lowland
      vec3 lowC=mix(uLow,uLow2,smoothstep(-.3,.3,moist)*uMoist);
      vec3 land=mix(uSand,lowC,smoothstep(0.,.04,t));
      land=mix(land,uHigh,smoothstep(.2,.5,t));
      land=mix(land,uRock,max(smoothstep(.5,.72,t),smoothstep(.06,.2,slope)*.6));   // cliffs show bare rock
      land=mix(land,snowCol,smoothstep(.78,.88,t+iceN*.08)*(1.-smoothstep(.03,.12,slope)));   // snow slides off cliffs
      col=mix(col,land,1.-water);
      ice=smoothstep(uIce,uIce+.04,abs(p.y)+h*.2+iceN*.06);   // ragged cap edge
      if(uLocked>.5){                              // tidally locked: frozen night side, scorched sub-solar point
        float sd=dot(p,uSun)+h*.15;
        ice=max(ice,1.-smoothstep(-.35,-.05,sd));
        float hot=smoothstep(.45,.8,sd);
        col=mix(col,mix(uSand,uRock,smoothstep(.05,.6,t)),hot); water*=1.-hot;   // baked desert follows the terrain
      }
      if(ice>.01){                                 // ice relief from the drift noise, blended over land/waves
        float e=max(gPx*.7,.00005);
        float ix=fbm(normalize(p+t1*e)*12.+uSeed.zyx,12.), iy=fbm(normalize(p+t2*e)*12.+uSeed.zyx,12.);
        vec3 ni=normalize(p-(t1*(ix-iceN)+t2*(iy-iceN))/e*.004);
        n=normalize(mix(n,ni,ice));               // ice sheets bury the terrain underneath
      }
      col=mix(col,snowCol,ice); water*=1.-ice; t+=ice;
    }
    vec3 v=normalize(uCam-p);
    float ndl=dot(n,uSun);
    float lit=1.-ringShadow(p,uSun)*.85;                 // banded shadow cast by the rings
    vec3 c=col*(.01+smoothstep(-.15,1.,ndl)*uSunCol*lit);   // soft terminator
    // water: tight sun glint + broad sheen, and sky reflection that grows at grazing angles (Fresnel)
    float nh=max(dot(n,normalize(uSun+v)),0.), day=smoothstep(-.1,.25,dot(p,uSun))*lit;
    float fres=.02+.98*pow(1.-max(dot(n,v),0.),5.);
    float sky=pow(max(dot(reflect(-v,n),uSun),0.),3.);   // wave facets catching the bright sky near the sun
    c+=water*(1.-uLava)*day*(uSunCol*(pow(nh,300.)*3.+pow(nh,25.)*.12)+uAtmo*(fres*.5+sky*(.15+fres)*.5));
    c+=ice*day*uSunCol*pow(nh,60.)*.25;                        // icy sheen
    c+=uLava*water*col*1.5;                                    // glowing seas
    c+=uGlow*col*(1.-day)*1.2;                                 // red-hot night side
    float lights=step(.55,snoise(p*70.+uSeed))*(1.-water)*step(.01,t)*step(t,.45);
    c+=uCity*lights*vec3(1.,.72,.35)*(1.-smoothstep(-.2,.05,dot(p,uSun)));   // night-side cities
    c+=uAtmo*pow(1.-max(dot(p,v),0.),3.)*(.15+max(dot(p,uSun),0.))*.8*uSunCol;
    gl_FragColor=vec4(c,1.);
    #include <colorspace_fragment>
  }`,
});

const cloudMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{ uSeed:{value:new THREE.Vector3()}, uCloud:num(.2), uCol:col3(), uSunCol:col3(),
             uSun:{value:new THREE.Vector3()}, uTime:num(0), uStretch:num(1.75), uSwirl:num(0), ...ringUniforms() },
  vertexShader: VERT,
  fragmentShader: NOISE + RINGFN + `
  uniform vec3 uSeed,uCol,uSun,uSunCol; uniform float uCloud,uTime,uStretch,uSwirl;
  varying vec3 vPos;
  void main(){
    vec3 p=normalize(vPos);
    gPx=length(fwidth(p));
    vec3 q=p*vec3(2.,2.*uStretch,2.)+uSeed.zxy+uTime*.015;
    if(uSwirl>0.) q+=uSwirl*vec3(snoise(q*.6+2.),snoise(q*.6+5.),snoise(q*.6+9.));   // storm swirls
    float c=fbm(q,2.*uStretch);
    float a=smoothstep(uCloud,uCloud+.2,c)*.95;
    float base=max(uCloud,-.5);
    vec3 shade=uCol*(.65+.35*smoothstep(base,base+.7,c));   // thicker cloud is brighter
    float lit=1.-ringShadow(p,uSun)*.85;
    gl_FragColor=vec4(shade*(.006+smoothstep(-.15,1.,dot(p,uSun))*uSunCol*lit),a);
    #include <colorspace_fragment>
  }`,
});

const atmoMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uAtmo:col3(), uSunW:{value:new THREE.Vector3()}, uSunCol:col3(), uStr:num(1) },
  vertexShader:`varying vec3 vN,vWN; void main(){ vN=normalize(normalMatrix*normal); vWN=normalize(mat3(modelMatrix)*normal);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 uAtmo,uSunW,uSunCol; uniform float uStr; varying vec3 vN,vWN;
  void main(){
    float i=clamp(-vN.z/.45,0.,1.); i*=i;          // 1 at the planet's edge, 0 at the halo's rim
    gl_FragColor=vec4(uAtmo*uSunCol*i*(.15+max(dot(vWN,uSunW),0.))*1.3*uStr,1.);
    #include <colorspace_fragment>
  }`,
});

const ringMat = new THREE.ShaderMaterial({
  side:THREE.DoubleSide, transparent:true, depthWrite:false,
  uniforms:{ uA:col3(), uB:col3(), uSunW:{value:new THREE.Vector3()}, uSunCol:col3(),
             uK:{value:new THREE.Vector3()}, uIn:num(1.4), uOut:num(2.2), uGaps:{value:new THREE.Vector2()}, uDust:num(1) },
  vertexShader:`varying vec3 vP,vW,vNw; void main(){ vP=position; vW=(modelMatrix*vec4(position,1.)).xyz;
    vNw=normalize(mat3(modelMatrix)*vec3(0,0,1));
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: RINGFN + `uniform vec3 uA,uB,uSunW,uSunCol,uK; uniform vec2 uGaps; uniform float uIn,uOut,uDust; varying vec3 vP,vW,vNw;
  // ringlets all the way down: octaves of 1D noise until they'd be thinner than a pixel
  float ringlets(float x, float px){
    float s=0., a=.5, norm=0.;
    for(int i=0;i<10;i++){
      float w=1.-smoothstep(.25,.5,px);
      if(w<=0.) break;
      s+=a*w*n1(x); norm+=a*w; x=x*2.13+5.7; px*=2.13; a*=.6;
    }
    return s/max(norm,1e-4);
  }
  void main(){
    float t=(length(vP.xy)-uIn)/(uOut-uIn), ft=fwidth(t);
    float b=ringBands(t,uK);                                    // main band structure
    b*=1.+(ringlets(t*uK.x*5.,ft*uK.x*5.)-.5)*.7;              // fine ringlets, sharper as you zoom in
    // up close: grainy ice-particle sparkle in the ring plane
    float k=600., grain=fract(sin(dot(floor(vP.xy*k),vec2(12.9898,78.233)))*43758.5);
    b*=1.+(grain-.5)*.5*(1.-smoothstep(.3,.8,length(fwidth(vP.xy))*k));
    float a=ringAlpha(t,b,uGaps,uDust);                         // sparse bands go see-through
    float shadow=(dot(vW,uSunW)<0. && length(cross(vW,uSunW))<1.)?.08:1.;   // planet's shadow on the ring
    // seen from the sunlit face the ring reflects; from the dark face only thin parts glow with light passing through
    float sideS=dot(vNw,uSunW), sideV=dot(vNw,cameraPosition-vW);
    float light=sideS*sideV>0. ? .75+.5*abs(sideS) : .3+.6*(1.-a);
    vec3 col=mix(uA,uB,b)*mix(.8,1.2,n1(t*uK.z*2.+4.));        // slight colour drift across the rings
    gl_FragColor=vec4(col*uSunCol*light*(.05+.95*shadow),a);
    #include <colorspace_fragment>
  }`,
});

// ring particles: chunks of rock/ice spread through the same bands with a little thickness.
// position holds (u across the ring, angle, height); they fade in as the camera gets close.
const ringPtsMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{ uIn:num(1.4), uOut:num(2.2), uK:{value:new THREE.Vector3()}, uGaps:{value:new THREE.Vector2()}, uDust:num(1),
             uA:col3(), uB:col3(), uSunW:{value:new THREE.Vector3()}, uSunCol:col3(), uScale:num(1), uThick:num(.02) },
  vertexShader: RINGFN + `uniform float uIn,uOut,uDust,uScale,uThick; uniform vec3 uK,uA,uB,uSunW,uSunCol; uniform vec2 uGaps;
  attribute float aRand; varying float vA; varying vec3 vCol;
  void main(){
    float r=uIn+position.x*(uOut-uIn);
    vec4 wp=modelMatrix*vec4(cos(position.y)*r, position.z*uThick*(.3+aRand), sin(position.y)*r, 1.);
    vA=ringAlpha(position.x,ringBands(position.x,uK),uGaps,uDust);
    float shadow=(dot(wp.xyz,uSunW)<0. && length(cross(wp.xyz,uSunW))<1.)?.08:1.;
    vCol=mix(uA,uB,aRand)*uSunCol*(.6+.8*aRand)*(.1+.9*shadow);
    vec4 mv=viewMatrix*wp;
    float d=-mv.z;
    vA*=1.-smoothstep(1.5,5.,d);
    gl_PointSize=clamp(uScale*.003*(.5+aRand)/d,1.,8.);   // ~0.003-unit chunks in perspective
    gl_Position=projectionMatrix*mv;
  }`,
  fragmentShader:`varying float vA; varying vec3 vCol;
  void main(){
    float m=1.-smoothstep(.2,.5,length(gl_PointCoord-.5));
    gl_FragColor=vec4(vCol,vA*m);
    #include <colorspace_fragment>
  }`,
});

const nebulaMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false,
  uniforms:{ uSeed:{value:new THREE.Vector3()}, uA:col3(), uB:col3(), uDensity:num(1) },
  vertexShader: VERT,
  fragmentShader: NOISE + `uniform vec3 uSeed,uA,uB; uniform float uDensity; varying vec3 vPos;

  for (let i=0;i<16;i++) r();   // warm up
  return r;
}

function makeName(r, isPlanet){
  const pick = a => a[Math.floor(r()*a.length)];
  const base = () => { let n=''; for (let i=0,k=2+Math.floor(r()*2);i<k;i++) n+=pick(SYL); return n[0].toUpperCase()+n.slice(1); };
  const roll = r();
  if (roll<.2){ const [pre,max] = pick(CATALOG); return pre+(1+Math.floor(r()*max))+(isPlanet ? ' '+pick([...'bcdefgh']) : ''); }
  if (roll<.3) return pick(PREFIX)+base();
  const n = base();
  return r()<.35 ? n+' '+pick(SUFFIX) : n;
}

  // generic knobs every world rolls, so two worlds of the same kind still differ a lot
  const gen = { warp: r()<.5 ? r()*.5 : 0, ridge: r()<.35 ? r()*.8 : 0, terrace: r()<.1 ? .4+r()*.6 : 0,
    moist: .3+r()*.7, stretch: 1+r()*2.5, swirl: r()<.35 ? r()*.8 : 0, sharp: r(), turb: .8+r()*2.5,
    storms: Math.floor(r()*4), spin: .02+r()*.07, atmoStr: .7+r()*.7 };
  const lowShift = (r()-.5)*.2, lowLight = (r()-.5)*.15;
  const k = {...BASE, ...gen, ...KINDS[name](r, j, h)};
  k.low2 ??= k.low.clone().offsetHSL(lowShift, 0, lowLight);
  return k;
}

function applyKind(mat, k, r){
  const u = mat.uniforms;
  u.uSeed.value.set(r()*50,r()*50,r()*50);
  u.uFreq.value = k.freq ?? .8+r()*1.2;
  const set = {uSea:k.sea, uIce:k.ice, uLava:k.lava, uGas:k.gas, uBands:k.bands, uCity:k.city, uCrater:k.crater,
    uWarp:k.warp, uRidge:k.ridge, uTerrace:k.terrace, uLocked:k.locked, uGlow:k.glow, uMoist:k.moist,
    uTurb:k.turb, uStorms:k.storms, uSharp:k.sharp};
  for (const key in set) u[key].value = set[key];
  for (const key of ['deep','shallow','sand','low','low2','high','rock','snow','atmo'])
    u['u'+key[0].toUpperCase()+key.slice(1)].value.copy(k[key]);
}

function addOrbiters(r, n, orbit, pool, [s0,s1], [g0,g1]){
  for (let i=0;i<n;i++){
    const kindName = pool[Math.floor(r()*pool.length)];
    const mat = bodyMat.clone();
    applyKind(mat, makeKind(kindName, r), r);
    const mesh = new THREE.Mesh(moonGeo, mat);
    mesh.scale.setScalar(s0+r()*(s1-s0));
    orbit += g0+r()*g1;
    mesh.position.x = orbit;
    const pivot = new THREE.Group();
    pivot.rotation.set((r()-.5)*.3, r()*Math.PI*2, (r()-.5)*.3);
    pivot.add(mesh); tilt.add(pivot);
    moons.push({pivot, mesh, speed:.6/orbit**1.5, kindName});
  }
  return orbit;
}

function makeBelt(r, radius, width){
  const N = 5000, pos = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    const a = r()*Math.PI*2, d = radius+(r()+r()-1)*width;
    pos.set([Math.cos(a)*d, (r()-.5)*width*.15, Math.sin(a)*d], i*3);
  }
  belt.geometry.dispose();
  belt.geometry = new THREE.BufferGeometry();
  belt.geometry.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const icy = r()<.35;
  belt.material.color.copy(icy ? c(.58,.25,.8) : c(.07,.2,.5));
}

function pickStar(r, pool){
  const name = pool[Math.floor(r()*pool.length)];
  const [h,s,l,size] = STAR_TYPES[name];
  return {name, col:c(h+(r()-.5)*.03, s, l+(r()-.5)*.06), size:size*(.85+r()*.3)};
}

function build(seed){
  const r = rngFor(seed);
  const pick = a => a[Math.floor(r()*a.length)];
  const roll = r();
  mode = roll<.7 ? 'planet' : roll<.9 ? 'star' : 'blackhole';
  controls.minDistance = 1.15;
  for (const o of [planet, clouds, atmo, rings, ringPts]) o.visible = mode==='planet';
  binary.visible = mode==='star';
  for (const o of [horizon, disk, halo]) o.visible = mode==='blackhole';
  sunSprite.visible = mode==='planet';
  belt.visible = false;
  for (const m of moons){ tilt.remove(m.pivot); m.mesh.material.dispose(); }
  moons = [];

  let orbit, bits;
  if (mode==='star'){
    const A = pickStar(r, STAR_POOL);
    sunCol.copy(A.col).lerp(WHITE,.45);   // light is paler than the star looks, so worlds keep their colours
    const isBinary = A.name!=='neutron star' && r()<.3;
    const B = isBinary ? pickStar(r, SUN_POOL) : null;
    const setStar = (mesh, S) => {
      mesh.scale.setScalar(S.size);
      mesh.children[0].scale.setScalar(4.4); mesh.children[0].material.map = CORONA_TEX;
      mesh.children[0].material.color.copy(S.col);
      const u = mesh.material.uniforms;
      u.uSeed.value.set(r()*50,r()*50,r()*50);
      u.uHot.value.copy(S.col);
      u.uCool.value.copy(S.col).lerp(c(.02,1,.3),.6);
    };
    setStar(stars[0], A);
    stars[1].visible = isBinary;
    let reach = A.size;
    if (isBinary){
      setStar(stars[1], B);
      const sep = A.size+B.size+.5+r()*.8, ma = A.size**2, mb = B.size**2;   // heavier star sits nearer the centre
      stars[0].position.x = -sep*mb/(ma+mb); stars[1].position.x = sep*ma/(ma+mb);
      reach = Math.max(-stars[0].position.x+A.size, stars[1].position.x+B.size);
      binary.userData.spin = .4/sep;
    } else { stars[0].position.x = 0; binary.userData.spin = 0; }
    controls.minDistance = reach+.15;
    if (A.name==='neutron star'){
      r(); r();   // (used to roll beams; kept so seeds stay the same)
      stars[0].material.uniforms.uCool.value.copy(A.col).multiplyScalar(.8);   // white-hot, no sunspots
      const glow = stars[0].children[0];          // soft blue-white haze instead of a hard corona
      glow.material.map = SOFT_TEX; glow.scale.setScalar(40); glow.material.color.copy(c(.6,.8,.5));
    }
    const n = 1+Math.floor(r()*5), beltAfter = r()<.5 ? Math.floor(r()*(n+1)) : -1;
    orbit = reach+.5;
    for (let i=0;i<=n;i++){
      if (i===beltAfter){ const w = .25+r()*.3; orbit += .4+w; makeBelt(r, orbit, w); belt.visible = true; orbit += w; }
      if (i<n) orbit = addOrbiters(r, 1, orbit, KIND_POOL, [.1,.28], [.5,.6]);
    }
    const name = (isBinary ? 'Binary: '+A.name+' + '+B.name : A.name);
    bits = [name[0].toUpperCase()+name.slice(1), `${n} planet${n>1?'s':''}: `+moons.map(m=>m.kindName).join(', ')];
    if (belt.visible) bits.push('asteroid belt');
  } else if (mode==='blackhole'){
    const outer = 1.8+r()*1.8, h = r();
    disk.geometry.dispose(); disk.geometry = new THREE.RingGeometry(.75,outer,256,1);
    disk.rotation.x = -Math.PI/2+(r()-.5)*.3;
    diskMat.uniforms.uOut.value = outer;
    const blue = r()<.3;
    diskMat.uniforms.uHot.value.copy(blue ? c(.58,.5,.95) : r()<.7 ? c(.12,.7,.92) : c(h+.05,.6,.92));
    diskMat.uniforms.uCool.value.copy(blue ? c(.65,.9,.45) : r()<.7 ? c(.03,1,.5) : c(h,1,.5));
    haloMat.uniforms.uHot.value.copy(diskMat.uniforms.uHot.value);
    haloMat.uniforms.uCool.value.copy(diskMat.uniforms.uCool.value);
    orbit = outer;
    bits = ['Black hole', `${(3+r()*60).toFixed(1)} solar masses`];
    r();   // (used to roll jets; kept so seeds stay the same)
  } else {
    ({orbit, bits} = buildPlanet(r, pick));
  }

  tilt.rotation.z = r()*.45;
  nebulaMat.uniforms.uSeed.value.set(r()*50,r()*50,r()*50);
  nebulaMat.uniforms.uA.value.copy(c(r(),.7,.5)); nebulaMat.uniforms.uB.value.copy(c(r(),.7,.5));
  nebulaMat.uniforms.uDensity.value = .3+r()*1.2;
  // auto-fit the system, unless the user has zoomed away from the last auto distance
  if (autoDist===null || Math.abs(camera.position.length()-autoDist)<.05){
    autoDist = Math.min(18, Math.max(3.6, orbit*1.25+1));
    camera.position.setLength(autoDist);
  }
  document.getElementById('name').textContent = makeName(r, mode==='planet');
  document.getElementById('meta').textContent = bits.join(' · ');
  document.getElementById('seed').textContent = 'seed '+seed;
}

function buildPlanet(r, pick){
  const S = pickStar(r, SUN_POOL);
  sunCol.copy(S.col).lerp(WHITE,.45);
  sunSprite.material.color.copy(S.col);
  sunSprite.scale.setScalar(8+S.size*10);

  const kindName = pick(KIND_POOL);
  const k = makeKind(kindName, r);
  applyKind(planetMat, k, r);
  planetSpin = k.locked ? 0 : k.gas ? .08+r()*.1 : k.spin;

  cloudMat.uniforms.uSeed.value.copy(planetMat.uniforms.uSeed.value);
  cloudMat.uniforms.uCloud.value = k.cloud;
  cloudMat.uniforms.uCol.value.copy(k.cloudCol);
  cloudMat.uniforms.uStretch.value = k.stretch;
  cloudMat.uniforms.uSwirl.value = k.swirl;
  clouds.visible = k.cloud < 1;
  atmoMat.uniforms.uAtmo.value.copy(k.atmo);
  atmoMat.uniforms.uStr.value = k.atmoStr;
  atmo.visible = k.atmo !== BLACK;

  const ringed = r() < k.rings;
  rings.visible = ringPts.visible = ringed;
  planetMat.uniforms.uRinged.value = cloudMat.uniforms.uRinged.value = ringed ? 1 : 0;
  if (ringed){
    const inner = 1.25+r()*.35, outer = inner+.4+r()*1.1;
    rings.geometry.dispose(); rings.geometry = new THREE.RingGeometry(inner,outer,256,1);
    const u = ringMat.uniforms, pu = ringPtsMat.uniforms;
    u.uIn.value = inner; u.uOut.value = outer;
    u.uK.value.set(20+r()*80, 7+r()*30, 3+r()*10);
    u.uGaps.value.set(.15+r()*.6, r()<.5 ? r() : -1);
    u.uDust.value = .5+r()*.5;
    const hue = r(), tinted = r()<.35;
    u.uA.value.copy(k.gas && !tinted ? k.snow : c(hue,tinted?.35:.15,.72));
    u.uB.value.copy(k.gas && !tinted ? k.rock : c(hue+.05,tinted?.4:.2,.45));
    r();   // (used to be a spin of the ring in its own plane; kept so seeds stay the same)
    // particles and the shadows on planet + clouds share the ring's bands
    for (const key of ['uIn','uOut','uDust']) pu[key].value = u[key].value;
    for (const key of ['uK','uGaps','uA','uB']) pu[key].value.copy(u[key].value);
    for (const m of [planetMat, cloudMat]){
      const s = m.uniforms;
      s.uRIn.value = inner; s.uROut.value = outer; s.uRDust.value = u.uDust.value;
      s.uRK.value.copy(u.uK.value); s.uRGaps.value.copy(u.uGaps.value);
    }
  }

  const nMoons = Math.max(r()<.15 ? 0 : 1, Math.floor(r()*(k.moons+1)));   // most worlds get at least one
  const orbit = addOrbiters(r, nMoons, ringed ? ringMat.uniforms.uOut.value+.4 : 1.7, MOON_POOL, [.1,.28], [.35,.55]);

  const bits = [NOT_WORLD.has(kindName) ? kindName : kindName+' world',
    nMoons ? `${nMoons} moon${nMoons>1?'s':''}` : 'no moons'];
  if (ringed) bits.push('ringed');
  if (k.locked) bits.push('tidally locked');
  if (k.city) bits.push('inhabited');
  bits.push('orbiting a '+S.name);
  return {orbit, bits};
}

// seeds are unsigned 64-bit integers written in the URL hash
const MAX = (1n<<64n)-1n;
function fromHash(){ const s = location.hash.slice(1); return /^\d+$/.test(s) ? BigInt(s) & MAX : null; }
function newWorld(){
  const seed = crypto.getRandomValues(new BigUint64Array(1))[0];
  history.replaceState(null,'','#'+seed);
  build(seed);
}
addEventListener('hashchange',()=>{ const s=fromHash(); if (s!==null) build(s); });
fromHash()!==null ? build(fromHash()) : newWorld();

// click (not drag) = new world
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if (!wallpaper && down && Math.hypot(e.clientX-down[0],e.clientY-down[1])<5) newWorld();
  down=null;
});

// --- Wallpaper Engine ---
// Wallpaper Engine calls applyUserProperties on load with the settings from project.json, which switches
// the page into wallpaper mode: no input (desktop clicks pass through), slow camera drift, worlds cycle on a timer.
let wallpaper = false, fixedSeed = null, cycleMin = 10, cycleTimer = null, fpsLimit = 0;
const fadeEl = document.getElementById('fade');
function fadeTo(fn){ fadeEl.style.opacity = 1; setTimeout(()=>{ fn(); fadeEl.style.opacity = 0; }, 1000); }
function restartCycle(){
  clearInterval(cycleTimer);
  if (cycleMin>0 && fixedSeed===null) cycleTimer = setInterval(()=>fadeTo(newWorld), cycleMin*60000);
}
window.wallpaperPropertyListener = {
  applyUserProperties(p){
    if (!wallpaper){
      wallpaper = true;
      document.getElementById('hint').hidden = true;
      Object.assign(controls,{enabled:false, autoRotate:true, autoRotateSpeed:.3});
    }
    if (p.showinfo) document.getElementById('info').hidden = !p.showinfo.value;
    if (p.drift) controls.autoRotateSpeed = p.drift.value;
    if (p.quality){ renderer.setPixelRatio(Math.min(devicePixelRatio,2)*p.quality.value/100); resize(); }
    if (p.seed){
      const s = p.seed.value.trim();
      fixedSeed = /^\d+$/.test(s) ? BigInt(s) & MAX : null;
      if (fixedSeed!==null){ history.replaceState(null,'','#'+fixedSeed); build(fixedSeed); }
    }
    if (p.cycle) cycleMin = p.cycle.value;
    restartCycle();
  },
  applyGeneralProperties(p){ if (p.fps!==undefined) fpsLimit = p.fps; },   // Wallpaper Engine's FPS limit
};
addEventListener('keydown',e=>{ if (e.code==='Space'){ e.preventDefault(); newWorld(); } });

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  // pixels per world unit at distance 1, for sizing ring particles
  ringPtsMat.uniforms.uScale.value = renderer.getPixelRatio()*innerHeight/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
}
addEventListener('resize',resize); resize();

// --- loop ---
const clock = new THREE.Clock(), q = new THREE.Quaternion();
const toLocal = (mesh,v) => v.clone().applyQuaternion(mesh.getWorldQuaternion(q).invert());
const tmp = new THREE.Vector3();
function lightBody(mesh, sunW){
  const u = mesh.material.uniforms;
  u.uSun.value.copy(toLocal(mesh,sunW));
  u.uCam.value.copy(mesh.worldToLocal(camera.position.clone()));
  u.uSunCol.value.copy(sunCol);
  u.uTime.value = clock.elapsedTime;
}
let lastFrame = 0;
renderer.setAnimationLoop(now=>{
  if (fpsLimit>0 && now-lastFrame < 1000/fpsLimit-1) return;   // skip frames to respect the FPS limit
  lastFrame = now;
  const dt = clock.getDelta(), time = clock.elapsedTime;
  planet.rotation.y += dt*planetSpin;
  clouds.rotation.y += dt*(planetSpin+.015);
  binary.rotation.y += dt*(binary.userData.spin||0);
  belt.rotation.y += dt*.02;
  for (const s of stars) s.rotation.y += dt*.03;
  for (const m of moons){ m.pivot.rotation.y += dt*m.speed; m.mesh.rotation.y += dt*.1; }
  controls.update();
  tilt.updateMatrixWorld();
  halo.quaternion.copy(camera.quaternion);
  lightBody(planet, SUN);
  // around a star, light comes from the centre; otherwise from the distant sun
  for (const m of moons) lightBody(m.mesh, mode==='star' ? m.mesh.getWorldPosition(tmp).negate().normalize() : SUN);
  for (const s of stars){
    s.material.uniforms.uTime.value = time;
    s.material.uniforms.uCam.value.copy(s.worldToLocal(camera.position.clone()));
  }
  diskMat.uniforms.uTime.value = time;
  cloudMat.uniforms.uSun.value.copy(toLocal(clouds,SUN));
  cloudMat.uniforms.uSunCol.value.copy(sunCol);
  cloudMat.uniforms.uTime.value = time;
  atmoMat.uniforms.uSunW.value.copy(SUN); atmoMat.uniforms.uSunCol.value.copy(sunCol);
  ringMat.uniforms.uSunW.value.copy(SUN); ringMat.uniforms.uSunCol.value.copy(sunCol);
  ringPtsMat.uniforms.uSunW.value.copy(SUN); ringPtsMat.uniforms.uSunCol.value.copy(sunCol);
  renderer.render(scene,camera);
});
</script>
</body>
</html>
