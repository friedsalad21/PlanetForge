<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlanetForge</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block;touch-action:none;cursor:pointer}
  #info{position:fixed;left:0;right:0;bottom:28px;text-align:center;pointer-events:none;text-shadow:0 2px 8px #000}
  #name{font-size:clamp(28px,6vw,52px);font-weight:700;letter-spacing:.06em}
  #meta{opacity:.65;font-size:14px;margin-top:4px}
  #hint{position:fixed;top:14px;left:0;right:0;text-align:center;opacity:.45;font-size:13px;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hint">click for a new world · drag to spin · scroll to zoom</div>
<div id="info"><div id="name"></div><div id="meta"></div></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 3D simplex noise, Ashima Arts / Stefan Gustavson (MIT)
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){float s=0.,a=.5;for(int i=0;i<6;i++){s+=a*snoise(p);p=p*2.03+1.7;a*=.5;}return s;}
`;

const VERT = `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;

const planetMat = new THREE.ShaderMaterial({
  uniforms: {
    uSeed:{value:new THREE.Vector3()}, uFreq:{value:1}, uSea:{value:0}, uIce:{value:.8}, uLava:{value:0},
    uDeep:{value:new THREE.Color()}, uShallow:{value:new THREE.Color()}, uSand:{value:new THREE.Color()},
    uLow:{value:new THREE.Color()}, uHigh:{value:new THREE.Color()}, uRock:{value:new THREE.Color()},
    uSnow:{value:new THREE.Color()}, uAtmo:{value:new THREE.Color()},
    uSun:{value:new THREE.Vector3()}, uCam:{value:new THREE.Vector3()},
  },
  vertexShader: VERT,
  fragmentShader: NOISE + `
  uniform vec3 uSeed,uDeep,uShallow,uSand,uLow,uHigh,uRock,uSnow,uAtmo,uSun,uCam;
  uniform float uFreq,uSea,uIce,uLava;
  varying vec3 vPos;
  float height(vec3 p){ return fbm(p*uFreq+uSeed); }
  void main(){
    vec3 p=normalize(vPos);
    float h=height(p);
    // bump-map land from the height gradient (finite differences on the sphere)
    vec3 t1=normalize(cross(p, abs(p.y)<.99?vec3(0,1,0):vec3(1,0,0))), t2=cross(p,t1);
    float e=.004, water=step(h,uSea);
    vec3 n=p;
    if(water<.5){
      float hx=height(normalize(p+t1*e)), hy=height(normalize(p+t2*e));
      n=normalize(p-(t1*(hx-h)+t2*(hy-h))/e*.06);
    }
    float t=clamp((h-uSea)/(.65-uSea),0.,1.);
    vec3 col=mix(uShallow,uDeep,clamp((uSea-h)/.35,0.,1.));
    vec3 land=mix(uSand,uLow,smoothstep(0.,.04,t));
    land=mix(land,uHigh,smoothstep(.2,.5,t));
    land=mix(land,uRock,smoothstep(.5,.72,t));
    land=mix(land,uSnow,smoothstep(.78,.88,t));
    col=mix(col,land,1.-water);
    float ice=smoothstep(uIce,uIce+.04,abs(p.y)+h*.2);
    col=mix(col,uSnow,ice); water*=1.-ice;
    vec3 v=normalize(uCam-p);
    float diff=max(dot(n,uSun),0.);
    vec3 c=col*(.03+diff);
    c+=water*pow(max(dot(reflect(-uSun,n),v),0.),40.)*.6*(1.-uLava);
    c+=uLava*water*col*1.5;                                   // glowing lava seas
    c+=uAtmo*pow(1.-max(dot(p,v),0.),3.)*(.15+max(dot(p,uSun),0.))*.8;
    gl_FragColor=vec4(c,1.);
    #include <colorspace_fragment>
  }`,
});

const cloudMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{ uSeed:{value:new THREE.Vector3()}, uCloud:{value:.2}, uCol:{value:new THREE.Color()},
             uSun:{value:new THREE.Vector3()}, uTime:{value:0} },
  vertexShader: VERT,
  fragmentShader: NOISE + `
  uniform vec3 uSeed,uCol,uSun; uniform float uCloud,uTime;
  varying vec3 vPos;
  void main(){
    vec3 p=normalize(vPos);
    float c=fbm(p*vec3(2.,3.5,2.)+uSeed.zxy+uTime*.015);
    float a=smoothstep(uCloud,uCloud+.2,c)*.95;
    gl_FragColor=vec4(uCol*(.03+max(dot(p,uSun),0.)),a);
    #include <colorspace_fragment>
  }`,
});

const atmoMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uAtmo:{value:new THREE.Color()}, uSunW:{value:new THREE.Vector3()} },
  vertexShader:`varying vec3 vN,vWN; void main(){ vN=normalize(normalMatrix*normal); vWN=normalize(mat3(modelMatrix)*normal);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 uAtmo,uSunW; varying vec3 vN,vWN;
  void main(){
    float i=clamp(-vN.z/.45,0.,1.); i*=i;          // 1 at the planet's edge, 0 at the halo's rim
    gl_FragColor=vec4(uAtmo*i*(.15+max(dot(vWN,uSunW),0.))*1.3,1.);
    #include <colorspace_fragment>
  }`,
});

// --- scene ---
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45,1,.1,200);
camera.position.set(0,0,3.4);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls,{enablePan:false,enableDamping:true,minDistance:1.6,maxDistance:8});

const SUN = new THREE.Vector3(1,.4,.8).normalize();
const tilt = new THREE.Group(); scene.add(tilt);
const planet = new THREE.Mesh(new THREE.SphereGeometry(1,128,128), planetMat);
const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.02,96,96), cloudMat);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.12,96,96), atmoMat);
tilt.add(planet, clouds, atmo);

const starPos = new Float32Array(3000*3);
for (let i=0;i<starPos.length;i+=3){
  const v = new THREE.Vector3().randomDirection().multiplyScalar(60);
  starPos.set([v.x,v.y,v.z],i);
}
const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({size:1.5,sizeAttenuation:false,color:0xffffff})));

// --- generation ---
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const c = (h,s,l) => new THREE.Color().setHSL(((h%1)+1)%1,s,l);

const KINDS = {
  'Terran':  (r,j) => ({sea:-.1+r()*.22, ice:.72+r()*.18, cloud:r()*.3-.05, lava:0, cloudCol:c(0,0,1),
    deep:c(.62+j,.7,.13), shallow:c(.54+j,.6,.35), sand:c(.12,.4,.62), low:c(.28+j,.5,.28),
    high:c(.2+j,.35,.32), rock:c(.07,.15,.33), snow:c(0,0,.95), atmo:c(.58,.7,.6)}),
  'Alien':   (r,j,h) => ({sea:-.1+r()*.25, ice:.75+r()*.2, cloud:r()*.35, lava:0, cloudCol:c(h+.15,.3,.9),
    deep:c(h,.7,.14), shallow:c(h,.6,.36), sand:c(h+.5,.4,.6), low:c(h+.3,.55,.35),
    high:c(h+.4,.45,.4), rock:c(h+.45,.2,.3), snow:c(h+.6,.3,.9), atmo:c(h+.1,.8,.6)}),
  'Desert':  (r,j) => ({sea:-.6, ice:.9+r()*.1, cloud:.35+r()*.15, lava:0, cloudCol:c(.1,.3,.92),
    deep:c(.5,.4,.25), shallow:c(.48,.35,.45), sand:c(.1,.45,.62), low:c(.08+j,.5,.5),
    high:c(.05+j,.55,.4), rock:c(.03,.4,.28), snow:c(.1,.4,.75), atmo:c(.08,.6,.6)}),
  'Volcanic':(r) => ({sea:-.05+r()*.15, ice:2, cloud:.2+r()*.2, lava:1, cloudCol:c(0,0,.35),
    deep:c(.02,1,.35), shallow:c(.09,1,.55), sand:c(0,0,.05), low:c(0,0,.1),
    high:c(0,0,.14), rock:c(0,0,.2), snow:c(0,0,.28), atmo:c(.03,.9,.5)}),
  'Frozen':  (r,j) => ({sea:-.05+r()*.15, ice:.25+r()*.2, cloud:.1+r()*.2, lava:0, cloudCol:c(0,0,1),
    deep:c(.57+j,.5,.18), shallow:c(.52+j,.45,.4), sand:c(.55,.15,.7), low:c(.55,.2,.82),
    high:c(.58,.15,.9), rock:c(.6,.1,.55), snow:c(0,0,1), atmo:c(.55,.5,.8)}),
};
const KIND_POOL = ['Terran','Terran','Terran','Alien','Alien','Desert','Volcanic','Frozen'];
const SYL = ['ka','zor','vel','tha','mir','qu','dra','sel','ny','or','ae','bri','xen','lo','ru','vos','eth','pha','gor','li','ta','um','cy','ix','an','zu'];
const SUFFIX = ['I','II','III','IV','V','VII','Prime','b','c','Major','Minor'];

function makeName(r){
  const pick = a => a[Math.floor(r()*a.length)];
  let n=''; for (let i=0,k=2+Math.floor(r()*2);i<k;i++) n+=pick(SYL);
  n = n[0].toUpperCase()+n.slice(1);
  return r()<.35 ? n+' '+pick(SUFFIX) : n;
}

function build(seed){
  const r = mulberry32(seed);
  const kindName = KIND_POOL[Math.floor(r()*KIND_POOL.length)];
  const k = KINDS[kindName](r, (r()-.5)*.08, r());
  const u = planetMat.uniforms;
  u.uSeed.value.set(r()*50,r()*50,r()*50);
  u.uFreq.value = .8+r()*1.2;
  u.uSea.value = k.sea; u.uIce.value = k.ice; u.uLava.value = k.lava;
  for (const key of ['deep','shallow','sand','low','high','rock','snow','atmo'])
    u['u'+key[0].toUpperCase()+key.slice(1)].value.copy(k[key]);
  cloudMat.uniforms.uSeed.value.copy(u.uSeed.value);
  cloudMat.uniforms.uCloud.value = k.cloud;
  cloudMat.uniforms.uCol.value.copy(k.cloudCol);
  atmoMat.uniforms.uAtmo.value.copy(k.atmo);
  tilt.rotation.z = r()*.45;
  document.getElementById('name').textContent = makeName(r);
  document.getElementById('meta').textContent = `${kindName} world · seed ${seed}`;
}

function fromHash(){ const s = parseInt(location.hash.slice(1)); return Number.isFinite(s) ? s>>>0 : null; }
function newWorld(){
  const seed = (Math.random()*2**32)>>>0;
  history.replaceState(null,'','#'+seed);
  build(seed);
}
addEventListener('hashchange',()=>{ const s=fromHash(); if (s!==null) build(s); });
fromHash()!==null ? build(fromHash()) : newWorld();

// click (not drag) = new world
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if (down && Math.hypot(e.clientX-down[0],e.clientY-down[1])<5) newWorld();
  down=null;
});
addEventListener('keydown',e=>{ if (e.code==='Space'){ e.preventDefault(); newWorld(); } });

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

// --- loop ---
const clock = new THREE.Clock(), q = new THREE.Quaternion();
const toLocal = (mesh,v) => v.clone().applyQuaternion(mesh.getWorldQuaternion(q).invert());
renderer.setAnimationLoop(()=>{
  const dt = clock.getDelta();
  planet.rotation.y += dt*.05;
  clouds.rotation.y += dt*.065;
  controls.update();
  planetMat.uniforms.uSun.value.copy(toLocal(planet,SUN));
  planetMat.uniforms.uCam.value.copy(planet.worldToLocal(camera.position.clone()));
  cloudMat.uniforms.uSun.value.copy(toLocal(clouds,SUN));
  cloudMat.uniforms.uTime.value = clock.elapsedTime;
  atmoMat.uniforms.uSunW.value.copy(SUN);
  renderer.render(scene,camera);
});
</script>
</body>
</html>
