<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlanetForge</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block;touch-action:none;cursor:pointer}

  #name{font-size:clamp(28px,6vw,52px);font-weight:700;letter-spacing:.06em}
  #meta{opacity:.7;font-size:14px;margin-top:4px}
  #seed{opacity:.4;font-size:12px;margin-top:2px}
  #hint{position:fixed;top:14px;left:0;right:0;text-align:center;opacity:.45;font-size:13px;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hint">click for a new world · drag to spin · scroll to zoom</div>
<div id="info"><div id="name"></div><div id="meta"></div><div id="seed"></div></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 3D simplex noise, Ashima Arts / Stefan Gustavson (MIT)
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
// fbm with level of detail: keeps adding finer octaves until they'd be smaller than a pixel,
// so detail stays sharp at any zoom. gPx = pixel footprint on the unit sphere, set at the top of main();
// s = how much the caller scaled p.
float gPx=0.;
float fbm(vec3 p, float s){
  float sum=0., a=.5, px=gPx*s;
  for(int i=0;i<12;i++){
    float w=1.-smoothstep(.25,.5,px);   // fade the last octave in instead of popping
    if(w<=0.) break;
    sum+=a*w*snoise(p); p=p*2.03+1.7; px*=2.03; a*=.5;
  }
  return sum;
}
vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return fract(sin(p)*43758.5453);}
// one crater per grid cell: a bowl with a raised rim
float craters(vec3 p){
  vec3 i=floor(p), f=fract(p); float h=0.;
  for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
    vec3 g=vec3(x,y,z), o=hash3(i+g);
    float d=length(g+o-f)/(.2+.3*o.x);
    h+=d<1.?(d*d-1.)*.5:0.;
    h+=.2*exp(-(d-1.)*(d-1.)*30.);
  }
  return h;
}
`;

const VERT = `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const col3 = () => ({value:new THREE.Color()});

// one material for planets and moons; clone() gives each body its own uniforms
const bodyMat = new THREE.ShaderMaterial({
  uniforms: {
    uSeed:{value:new THREE.Vector3()}, uFreq:{value:1}, uSea:{value:0}, uIce:{value:.8}, uLava:{value:0},
    uGas:{value:0}, uBands:{value:10}, uCity:{value:0}, uCrater:{value:0}, uTime:{value:0},
    uDeep:col3(), uShallow:col3(), uSand:col3(), uLow:col3(), uHigh:col3(), uRock:col3(), uSnow:col3(), uAtmo:col3(),
    uSun:{value:new THREE.Vector3()}, uSunCol:col3(), uCam:{value:new THREE.Vector3()},
  },
  vertexShader: VERT,
  fragmentShader: NOISE + `
  uniform vec3 uSeed,uDeep,uShallow,uSand,uLow,uHigh,uRock,uSnow,uAtmo,uSun,uSunCol,uCam;
  uniform float uFreq,uSea,uIce,uLava,uGas,uBands,uCity,uCrater,uTime;
  varying vec3 vPos;
  float height(vec3 p){
    float h=fbm(p*uFreq+uSeed,uFreq)*(1.-.5*uCrater);
    if(uCrater>0.) h+=uCrater*(craters(p*2.5+uSeed)*.7+craters(p*6.+uSeed.yzx)*.35+craters(p*14.+uSeed.zxy)*.12);
    return h;
  }
  void main(){
    vec3 p=normalize(vPos), n=p, col;
    gPx=length(fwidth(p));
    float water=0., t=0.;
    if(uGas>.5){
      // banded gas giant with turbulent edges and one big storm
      float b=p.y*uBands+fbm(p*vec3(2.,7.,2.)+uSeed,7.)*2.2;
      col=mix(uLow,uHigh,sin(b)*.5+.5);
      col=mix(col,uRock,smoothstep(.3,.9,sin(b*.37+uSeed.x)*.5+.5)*.6);
      vec3 sd=normalize(vec3(cos(uSeed.x),.4*sin(uSeed.y),sin(uSeed.x)));
      float sw=snoise(p*9.+uSeed)*.04;
      col=mix(col,uSnow,1.-smoothstep(.12,.2,length((p-sd)*vec3(1.,2.4,1.))+sw));
    } else {
      float h=height(p);
      vec3 t1=normalize(cross(p, abs(p.y)<.99?vec3(0,1,0):vec3(1,0,0))), t2=cross(p,t1);
      water=step(h,uSea);
      float depth=uSea-h;
      if(water<.5){   // bump-map land from the height gradient
        float e=max(gPx*.7,.00005), hx=height(normalize(p+t1*e)), hy=height(normalize(p+t2*e));
        n=normalize(p-(t1*(hx-h)+t2*(hy-h))/e*.06);
      } else {        // moving waves: two noise scales, each fading out once smaller than a pixel
        vec3 g=vec3(0.);
        for(int k=0;k<3;k++){
          float wf=70.*pow(4.,float(k)), fade=1.-smoothstep(.1,.45,gPx*wf);
          if(fade<=0.) break;
          vec3 q=p*wf+uSeed+uTime*vec3(.13,.08,.11)*float(k+1);
          float w0=snoise(q);
          g+=(t1*(snoise(q+t1*.3)-w0)+t2*(snoise(q+t2*.3)-w0))/.3*fade*.06/float(k+1);
        }
        n=normalize(p-g);
      }
      t=clamp((h-uSea)/(.65-uSea),0.,1.);
      col=mix(uShallow,uDeep,smoothstep(0.,.3,depth));
      col=mix(col,uShallow*1.6,1.-smoothstep(0.,.035,depth));            // bright coastal shallows
      float foam=(1.-smoothstep(0.,.012,depth))*smoothstep(-.1,.5,snoise(p*180.+uSeed+uTime*.4));
      col=mix(col,vec3(.85),foam*water*.7*(1.-uLava));                    // surf on the shoreline
      vec3 land=mix(uSand,uLow,smoothstep(0.,.04,t));
      land=mix(land,uHigh,smoothstep(.2,.5,t));
      land=mix(land,uRock,smoothstep(.5,.72,t));
      land=mix(land,uSnow,smoothstep(.78,.88,t));
      col=mix(col,land,1.-water);
      float ice=smoothstep(uIce,uIce+.04,abs(p.y)+h*.2);
      col=mix(col,uSnow,ice); water*=1.-ice; t+=ice;
      if(ice>.5) n=p;
    }
    vec3 v=normalize(uCam-p);
    float ndl=dot(n,uSun);
    vec3 c=col*(.01+smoothstep(-.15,1.,ndl)*uSunCol);   // soft terminator
    // water: tight sun glint + broad sheen, and sky reflection that grows at grazing angles (Fresnel)
    float nh=max(dot(n,normalize(uSun+v)),0.), day=smoothstep(-.1,.25,dot(p,uSun));
    float fres=.02+.98*pow(1.-max(dot(n,v),0.),5.);
    float sky=pow(max(dot(reflect(-v,n),uSun),0.),3.);   // wave facets catching the bright sky near the sun
    c+=water*(1.-uLava)*day*(uSunCol*(pow(nh,300.)*3.+pow(nh,25.)*.12)+uAtmo*(fres*.5+sky*(.15+fres)*.5));
    c+=uLava*water*col*1.5;                                    // glowing seas
    float lights=step(.55,snoise(p*70.+uSeed))*(1.-water)*step(.01,t)*step(t,.45);
    c+=uCity*lights*vec3(1.,.72,.35)*(1.-smoothstep(-.2,.05,dot(p,uSun)));   // night-side cities
    c+=uAtmo*pow(1.-max(dot(p,v),0.),3.)*(.15+max(dot(p,uSun),0.))*.8*uSunCol;
    gl_FragColor=vec4(c,1.);
    #include <colorspace_fragment>
  }`,
});

const cloudMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{ uSeed:{value:new THREE.Vector3()}, uCloud:{value:.2}, uCol:col3(), uSunCol:col3(),
             uSun:{value:new THREE.Vector3()}, uTime:{value:0} },
  vertexShader: VERT,
  fragmentShader: NOISE + `
  uniform vec3 uSeed,uCol,uSun,uSunCol; uniform float uCloud,uTime;
  varying vec3 vPos;
  void main(){
    vec3 p=normalize(vPos);
    gPx=length(fwidth(p));
    float c=fbm(p*vec3(2.,3.5,2.)+uSeed.zxy+uTime*.015,3.5);
    float a=smoothstep(uCloud,uCloud+.2,c)*.95;
    gl_FragColor=vec4(uCol*(.006+smoothstep(-.15,1.,dot(p,uSun))*uSunCol),a);
    #include <colorspace_fragment>
  }`,
});

const atmoMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uAtmo:col3(), uSunW:{value:new THREE.Vector3()}, uSunCol:col3() },
  vertexShader:`varying vec3 vN,vWN; void main(){ vN=normalize(normalMatrix*normal); vWN=normalize(mat3(modelMatrix)*normal);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 uAtmo,uSunW,uSunCol; varying vec3 vN,vWN;
  void main(){
    float i=clamp(-vN.z/.45,0.,1.); i*=i;          // 1 at the planet's edge, 0 at the halo's rim
    gl_FragColor=vec4(uAtmo*uSunCol*i*(.15+max(dot(vWN,uSunW),0.))*1.3,1.);
    #include <colorspace_fragment>
  }`,
});

const ringMat = new THREE.ShaderMaterial({
  side:THREE.DoubleSide, transparent:true, depthWrite:false,
  uniforms:{ uA:col3(), uB:col3(), uSunW:{value:new THREE.Vector3()}, uSunCol:col3(),
             uK:{value:new THREE.Vector3()}, uIn:{value:1.4}, uOut:{value:2.2} },
  vertexShader:`varying vec3 vP,vW; void main(){ vP=position; vW=(modelMatrix*vec4(position,1.)).xyz;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 uA,uB,uSunW,uSunCol,uK; uniform float uIn,uOut; varying vec3 vP,vW;
  float h1(float x){return fract(sin(x*127.1)*43758.5);}
  float n1(float x){float i=floor(x);return mix(h1(i),h1(i+1.),smoothstep(0.,1.,fract(x)));}
  void main(){
    float t=(length(vP.xy)-uIn)/(uOut-uIn);
    float b=n1(t*uK.x)*.5+n1(t*uK.y+9.)*.3+n1(t*uK.z+3.)*.2;
    float gap=smoothstep(.0,.03,abs(t-fract(uK.x*.013)*.6-.2));      // one Cassini-style gap
    float a=b*gap*smoothstep(0.,.04,t)*(1.-smoothstep(.9,1.,t))*.85;
    float shadow=(dot(vW,uSunW)<0. && length(cross(vW,uSunW))<1.)?.08:1.;   // planet's shadow on the ring
    gl_FragColor=vec4(mix(uA,uB,b)*uSunCol*(.05+.95*shadow),a);
    #include <colorspace_fragment>
  }`,
});

const nebulaMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false,
  uniforms:{ uSeed:{value:new THREE.Vector3()}, uA:col3(), uB:col3() },
  vertexShader: VERT,
  fragmentShader: NOISE + `uniform vec3 uSeed,uA,uB; varying vec3 vPos;
  void main(){
    vec3 p=normalize(vPos);
    gPx=length(fwidth(p))*8.;   // the backdrop stays soft; this caps it at a few octaves
    float m=smoothstep(-.05,.6,fbm(p*1.6+uSeed,1.6));
    vec3 c=mix(uA,uB,fbm(p*3.+uSeed.yzx,3.)*.6+.5)*m*m*.22;
    gl_FragColor=vec4(c,1.);
    #include <colorspace_fragment>
  }`,
});

const starMat = new THREE.ShaderMaterial({
  uniforms:{ uSeed:{value:new THREE.Vector3()}, uHot:col3(), uCool:col3(), uTime:{value:0}, uCam:{value:new THREE.Vector3()} },
  vertexShader: VERT,
  fragmentShader: NOISE + `uniform vec3 uSeed,uHot,uCool,uCam; uniform float uTime; varying vec3 vPos;
  void main(){
    vec3 p=normalize(vPos);
    gPx=length(fwidth(p));
    float n=fbm(p*3.+uSeed+uTime*.03,3.);
    float g=snoise(p*40.+uTime*.3)*.5+.5;                         // granulation
    vec3 c=mix(uCool,uHot,smoothstep(-.35,.35,n))*(.8+.4*g);
    c*=.3+.7*sqrt(max(dot(p,normalize(uCam-p)),0.));             // limb darkening
    gl_FragColor=vec4(c*1.6,1.);
    #include <colorspace_fragment>
  }`,
});

const diskMat = new THREE.ShaderMaterial({
  side:THREE.DoubleSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uTime:{value:0}, uIn:{value:.8}, uOut:{value:2.6}, uHot:col3(), uCool:col3() },
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: NOISE + `uniform float uTime,uIn,uOut; uniform vec3 uHot,uCool; varying vec3 vP;
  void main(){
    float r=length(vP.xy), t=(r-uIn)/(uOut-uIn);
    float a=uTime*1.2/(r*r);                                     // inner gas orbits faster
    vec2 q=mat2(cos(a),-sin(a),sin(a),cos(a))*vP.xy;
    float n=snoise(vec3(q*2.5,r*7.))*.5+.5;
    float heat=pow(1.-t,2.);
    vec3 c=mix(uCool,uHot,heat)*(.3+n)*(.25+2.5*heat);
    c*=smoothstep(0.,.04,t)*(1.-smoothstep(.55,1.,t));
    gl_FragColor=vec4(c,1.);
    #include <colorspace_fragment>
  }`,
});

// camera-facing glow around a black hole: thin photon ring plus soft lensed light
const haloMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uHot:col3(), uCool:col3() },
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 uHot,uCool; varying vec3 vP;
  void main(){
    float r=length(vP.xy);
    float ring=exp(-abs(r-1.)*45.)*2.;
    float glow=exp(-(r-1.)*2.5)*step(1.,r)*.3;
    gl_FragColor=vec4(uHot*ring+uCool*glow,1.);
    #include <colorspace_fragment>
  }`,
});

// --- scene ---
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45,1,.05,300);
camera.position.set(0,1.1,3.4);   // a little above the equator so rings aren't edge-on
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls,{enablePan:false,enableDamping:true,minDistance:1.15,maxDistance:16});

const SUN = new THREE.Vector3(1,.3,.3).normalize();
const sunCol = new THREE.Color();
scene.add(new THREE.Mesh(new THREE.SphereGeometry(150,32,32), nebulaMat));

const starPos = new Float32Array(4000*3);
for (let i=0;i<starPos.length;i+=3){
  const v = new THREE.Vector3().randomDirection().multiplyScalar(100);
  starPos.set([v.x,v.y,v.z],i);
}
const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({size:1.5,sizeAttenuation:false,color:0xffffff})));

function glowTexture(stops){
  const cv = Object.assign(document.createElement('canvas'),{width:128,height:128});
  const g = cv.getContext('2d'), gr = g.createRadialGradient(64,64,0,64,64,64);
  for (const [at,a] of stops) gr.addColorStop(at,`rgba(255,255,255,${a})`);
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(cv);
}
// the system's star: a glow sprite far along the sun direction
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture([[0,1],[.12,.9],[.35,.15],[1,0]]),blending:THREE.AdditiveBlending,depthWrite:false}));
sunSprite.position.copy(SUN).multiplyScalar(90);
scene.add(sunSprite);

const tilt = new THREE.Group(); scene.add(tilt);
const planetMat = bodyMat.clone();
const planet = new THREE.Mesh(new THREE.SphereGeometry(1,256,256), planetMat);
const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.02,96,96), cloudMat);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.12,96,96), atmoMat);
const rings = new THREE.Mesh(new THREE.RingGeometry(1,2,256,1), ringMat);
rings.rotation.x = -Math.PI/2;
tilt.add(planet, clouds, atmo, rings);
const moonGeo = new THREE.SphereGeometry(1,128,128);
let moons = [];   // orbiting bodies: {pivot, mesh, speed, kindName}
let mode = 'planet', autoDist = null;
const starMesh = new THREE.Mesh(new THREE.SphereGeometry(1,128,128), starMat);
const corona = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture([[0,1],[.45,.9],[.55,.35],[.75,.08],[1,0]]),blending:THREE.AdditiveBlending,depthWrite:false}));
const horizon = new THREE.Mesh(moonGeo, new THREE.MeshBasicMaterial({color:0}));
horizon.scale.setScalar(.5);
const disk = new THREE.Mesh(new THREE.RingGeometry(.75,2.6,256,1), diskMat);
disk.rotation.x = -Math.PI/2;
const halo = new THREE.Mesh(new THREE.PlaneGeometry(8,8), haloMat);
halo.scale.setScalar(.56);
tilt.add(starMesh, horizon, disk);
scene.add(corona, halo);
// --- generation ---
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const c = (h,s,l) => new THREE.Color().setHSL(((h%1)+1)%1,s,l,THREE.SRGBColorSpace);
const BLACK = c(0,0,0), WHITE = c(0,0,1);

// each kind returns the fields that differ from these defaults
const BASE = { sea:-2, ice:2, cloud:2, lava:0, gas:0, city:0, crater:0, bands:10, freq:null, rings:.12, moons:3,
  cloudCol:WHITE, snow:c(0,0,.95), atmo:BLACK };
const KINDS = {
  'Terran':  (r,j) => ({sea:-.1+r()*.22, ice:.72+r()*.18, cloud:r()*.3-.05, city:r()<.45?1:0,
    deep:c(.62+j,.7,.13), shallow:c(.54+j,.6,.35), sand:c(.12,.4,.62), low:c(.28+j,.5,.28),
    high:c(.2+j,.35,.32), rock:c(.07,.15,.33), atmo:c(.58,.7,.6)}),
  'Ocean':   (r,j) => ({sea:.2+r()*.12, ice:.8+r()*.15, cloud:-.05+r()*.2,
    deep:c(.6+j,.8,.12), shallow:c(.5+j,.7,.4), sand:c(.13,.5,.7), low:c(.3,.6,.35),
    high:c(.25,.5,.3), rock:c(.08,.2,.35), atmo:c(.56,.8,.6)}),
  'Jungle':  (r,j) => ({sea:-.05+r()*.1, cloud:.02+r()*.15,
    deep:c(.5,.7,.13), shallow:c(.45,.6,.3), sand:c(.15,.5,.45), low:c(.33+j,.75,.18),
    high:c(.3+j,.6,.22), rock:c(.25,.3,.3), snow:c(.3,.2,.6), atmo:c(.4,.6,.6)}),
  'Alien':   (r,j,h) => ({sea:-.1+r()*.25, ice:.75+r()*.2, cloud:r()*.35, cloudCol:c(h+.15,.3,.9),
    deep:c(h,.7,.14), shallow:c(h,.6,.36), sand:c(h+.5,.4,.6), low:c(h+.3,.55,.35),
    high:c(h+.4,.45,.4), rock:c(h+.45,.2,.3), snow:c(h+.6,.3,.9), atmo:c(h+.1,.8,.6)}),
  'Desert':  (r,j) => ({sea:-.6, ice:.9+r()*.1, cloud:.35+r()*.15, cloudCol:c(.1,.3,.92),
    deep:c(.5,.4,.25), shallow:c(.48,.35,.45), sand:c(.1,.45,.62), low:c(.08+j,.5,.5),
    high:c(.05+j,.55,.4), rock:c(.03,.4,.28), snow:c(.1,.4,.75), atmo:c(.08,.6,.6)}),
  'Volcanic':(r) => ({sea:-.05+r()*.15, cloud:.2+r()*.2, lava:1, cloudCol:c(0,0,.35),
    deep:c(.02,1,.35), shallow:c(.09,1,.55), sand:c(0,0,.05), low:c(0,0,.1),
    high:c(0,0,.14), rock:c(0,0,.2), snow:c(0,0,.28), atmo:c(.03,.9,.5)}),
  'Frozen':  (r,j) => ({sea:-.05+r()*.15, ice:.25+r()*.2, cloud:.1+r()*.2,
    deep:c(.57+j,.5,.18), shallow:c(.52+j,.45,.4), sand:c(.55,.15,.7), low:c(.55,.2,.82),
    high:c(.58,.15,.9), rock:c(.6,.1,.55), snow:WHITE, atmo:c(.55,.5,.8)}),
  'Toxic':   (r) => ({sea:-.05+r()*.15, cloud:-.15+r()*.15, lava:.25, cloudCol:c(.15,.7,.7),
    deep:c(.2,.9,.2), shallow:c(.22,.9,.45), sand:c(.12,.5,.3), low:c(.1,.4,.25),
    high:c(.08,.35,.2), rock:c(.07,.25,.15), snow:c(.16,.6,.6), atmo:c(.18,.8,.5)}),
  // moons: cratered rock, no seas or air
  'Moon':      (r,j,h) => ({freq:1.5+r()*2, crater:1, sand:c(h,.05,.3), low:c(h,.05,.4), high:c(h,.04,.55),
    rock:c(h,.04,.65), snow:c(h,.03,.75), deep:BLACK, shallow:BLACK}),
  'Icy moon':  (r,j) => ({freq:1.5+r()*2, crater:.6, sand:c(.55,.25,.55), low:c(.56,.2,.7), high:c(.57,.15,.82),
    rock:c(.58,.1,.9), snow:WHITE, deep:BLACK, shallow:BLACK}),
  'Sulfur moon':(r) => ({freq:2+r()*2, crater:.3, sand:c(.08,.6,.3), low:c(.13,.8,.55), high:c(.11,.7,.45),
    rock:c(.05,.6,.35), snow:c(.15,.6,.8), deep:BLACK, shallow:BLACK}),
  'Barren':  (r,j,h) => ({freq:2+r()*2, rings:0, moons:2, crater:.7,
    deep:BLACK, shallow:BLACK, sand:c(h,.06,.45), low:c(h,.06,.42), high:c(h,.05,.34),
    rock:c(h,.05,.26), snow:c(0,0,.7)}),
  'Gas giant':(r,j,h) => {
    const pal = [
      [c(.08,.5,.75), c(.06,.6,.45), c(.03,.5,.35), c(.1,.3,.9), c(.08,.6,.6)],     // Jupiter-ish
      [c(.12,.45,.75), c(.11,.4,.6), c(.09,.35,.5), c(.12,.3,.9), c(.12,.5,.6)],    // Saturn-ish
      [c(.55,.5,.55), c(.6,.6,.4), c(.58,.4,.7), c(.55,.3,.9), c(.57,.7,.6)],       // ice giant
      [c(h,.5,.6), c(h+.08,.6,.4), c(h-.08,.5,.3), c(h+.5,.4,.85), c(h,.7,.6)],      // alien
    ][Math.floor(r()*4)];
    return {gas:1, bands:6+r()*16, rings:.65, moons:4,
      low:pal[0], high:pal[1], rock:pal[2], snow:pal[3], atmo:pal[4],
      deep:BLACK, shallow:BLACK, sand:BLACK};
  },
};
const KIND_POOL = ['Terran','Terran','Terran','Ocean','Jungle','Alien','Alien','Desert','Volcanic','Frozen','Toxic','Barren','Gas giant','Gas giant','Gas giant'];
const MOON_POOL = ['Moon','Moon','Moon','Moon','Icy moon','Icy moon','Sulfur moon'];
const STARS = [['yellow dwarf',c(.12,1,.92)],['orange dwarf',c(.08,1,.8)],['red dwarf',c(.02,1,.72)],
               ['blue giant',c(.6,1,.85)],['white star',c(0,0,1)]];
const SYL = ['ka','zor','vel','tha','mir','qu','dra','sel','ny','or','ae','bri','xen','lo','ru','vos','eth','pha','gor','li','ta','um','cy','ix','an','zu'];
const SUFFIX = ['I','II','III','IV','V','VII','Prime','b','c','Major','Minor'];

function makeName(r){
  const pick = a => a[Math.floor(r()*a.length)];
  let n=''; for (let i=0,k=2+Math.floor(r()*2);i<k;i++) n+=pick(SYL);
  n = n[0].toUpperCase()+n.slice(1);
  return r()<.35 ? n+' '+pick(SUFFIX) : n;
}

function makeKind(name, r){ return {...BASE, ...KINDS[name](r, (r()-.5)*.08, r())}; }

function applyKind(mat, k, r){
  const u = mat.uniforms;
  u.uSeed.value.set(r()*50,r()*50,r()*50);
  u.uFreq.value = k.freq ?? .8+r()*1.2;
  u.uSea.value = k.sea; u.uIce.value = k.ice; u.uLava.value = k.lava;
  u.uGas.value = k.gas; u.uBands.value = k.bands; u.uCity.value = k.city; u.uCrater.value = k.crater;
  for (const key of ['deep','shallow','sand','low','high','rock','snow','atmo'])
    u['u'+key[0].toUpperCase()+key.slice(1)].value.copy(k[key]);
}

function addOrbiters(r, n, orbit, pool, [s0,s1], [g0,g1]){
  for (let i=0;i<n;i++){
    const kindName = pool[Math.floor(r()*pool.length)];
    const mat = bodyMat.clone();
    applyKind(mat, makeKind(kindName, r), r);
    const mesh = new THREE.Mesh(moonGeo, mat);
    mesh.scale.setScalar(s0+r()*(s1-s0));
    orbit += g0+r()*g1;
    mesh.position.x = orbit;
    const pivot = new THREE.Group();
    pivot.rotation.set((r()-.5)*.3, r()*Math.PI*2, (r()-.5)*.3);
    pivot.add(mesh); tilt.add(pivot);
    moons.push({pivot, mesh, speed:.6/orbit**1.5, kindName});
  }
  return orbit;
}

function build(seed){
  const r = mulberry32(seed);
  const pick = a => a[Math.floor(r()*a.length)];
  const roll = r();
  mode = roll<.7 ? 'planet' : roll<.9 ? 'star' : 'blackhole';
  controls.minDistance = 1.15;
  for (const o of [planet, clouds, atmo, rings]) o.visible = mode==='planet';
  for (const o of [starMesh, corona]) o.visible = mode==='star';
  for (const o of [horizon, disk, halo]) o.visible = mode==='blackhole';
  sunSprite.visible = mode==='planet';
  for (const m of moons){ tilt.remove(m.pivot); m.mesh.material.dispose(); }
  moons = [];

  const [starName, starCol] = pick(STARS);
  sunCol.copy(starCol);
  let orbit, bits;
  if (mode==='star'){
    const size = {'blue giant':1.5,'red dwarf':.6,'orange dwarf':.85}[starName] ?? 1;
    starMesh.scale.setScalar(size);
    controls.minDistance = size+.15;
    corona.scale.setScalar(size*4.4); corona.material.color.copy(starCol);
    starMat.uniforms.uSeed.value.set(r()*50,r()*50,r()*50);
    starMat.uniforms.uHot.value.copy(starCol);
    starMat.uniforms.uCool.value.copy(starCol).lerp(c(.02,1,.3),.6);
    const n = 1+Math.floor(r()*5);
    orbit = addOrbiters(r, n, size+.5, KIND_POOL, [.1,.28], [.5,.6]);
    bits = [starName[0].toUpperCase()+starName.slice(1), `${n} planet${n>1?'s':''}: `+moons.map(m=>m.kindName).join(', ')];
  } else if (mode==='blackhole'){
    const outer = 2+r()*1.4, blue = r()<.3;
    disk.geometry.dispose(); disk.geometry = new THREE.RingGeometry(.75,outer,256,1);
    diskMat.uniforms.uOut.value = outer;
    diskMat.uniforms.uHot.value.copy(blue ? c(.58,.5,.95) : c(.12,.7,.92));
    diskMat.uniforms.uCool.value.copy(blue ? c(.65,.9,.45) : c(.03,1,.5));
    haloMat.uniforms.uHot.value.copy(diskMat.uniforms.uHot.value);
    haloMat.uniforms.uCool.value.copy(diskMat.uniforms.uCool.value);
    orbit = outer;
    bits = ['Black hole', `${(3+r()*60).toFixed(1)} solar masses`];
  } else {
    ({orbit, bits} = buildPlanet(r, pick, starName, starCol));
  }

  tilt.rotation.z = r()*.45;
  nebulaMat.uniforms.uSeed.value.set(r()*50,r()*50,r()*50);
  nebulaMat.uniforms.uA.value.copy(c(r(),.7,.5)); nebulaMat.uniforms.uB.value.copy(c(r(),.7,.5));
  // auto-fit the system, unless the user has zoomed away from the last auto distance
  if (autoDist===null || Math.abs(camera.position.length()-autoDist)<.05){
    autoDist = Math.max(3.6, orbit*1.25+1);
    camera.position.setLength(autoDist);
  }
  document.getElementById('name').textContent = makeName(r);
  document.getElementById('meta').textContent = bits.join(' · ');
  document.getElementById('seed').textContent = 'seed '+seed;
}

function buildPlanet(r, pick, starName, starCol){
  const kindName = pick(KIND_POOL);
  const k = makeKind(kindName, r);
  applyKind(planetMat, k, r);
  sunSprite.material.color.copy(starCol);
  sunSprite.scale.setScalar(starName==='blue giant' ? 26 : starName==='red dwarf' ? 12 : 18);

  cloudMat.uniforms.uSeed.value.copy(planetMat.uniforms.uSeed.value);
  cloudMat.uniforms.uCloud.value = k.cloud;
  cloudMat.uniforms.uCol.value.copy(k.cloudCol);
  clouds.visible = k.cloud < 1;
  atmoMat.uniforms.uAtmo.value.copy(k.atmo);
  atmo.visible = k.atmo !== BLACK;

  const ringed = r() < k.rings;
  rings.visible = ringed;
  if (ringed){
    const inner = 1.3+r()*.3, outer = inner+.5+r()*.9;
    rings.geometry.dispose(); rings.geometry = new THREE.RingGeometry(inner,outer,256,1);
    ringMat.uniforms.uIn.value = inner; ringMat.uniforms.uOut.value = outer;
    ringMat.uniforms.uK.value.set(20+r()*80, 7+r()*30, 3+r()*10);
    ringMat.uniforms.uA.value.copy(k.gas ? k.snow : c(r(),.15,.7));
    ringMat.uniforms.uB.value.copy(k.gas ? k.rock : c(r(),.2,.45));
    rings.rotation.z = (r()-.5)*.1;
  }

  const nMoons = Math.max(r()<.15 ? 0 : 1, Math.floor(r()*(k.moons+1)));   // most worlds get at least one
  const orbit = addOrbiters(r, nMoons, ringed ? ringMat.uniforms.uOut.value+.4 : 1.7, MOON_POOL, [.1,.28], [.35,.55]);

  const bits = [kindName==='Gas giant' ? 'Gas giant' : kindName+' world',
    nMoons ? `${nMoons} moon${nMoons>1?'s':''}` : 'no moons'];
  if (ringed) bits.push('ringed');
  if (k.city) bits.push('inhabited');
  bits.push('orbiting a '+starName);
  return {orbit, bits};
}

function fromHash(){ const s = parseInt(location.hash.slice(1)); return Number.isFinite(s) ? s>>>0 : null; }
function newWorld(){
  const seed = (Math.random()*2**32)>>>0;
  history.replaceState(null,'','#'+seed);
  build(seed);
}
addEventListener('hashchange',()=>{ const s=fromHash(); if (s!==null) build(s); });
fromHash()!==null ? build(fromHash()) : newWorld();

// click (not drag) = new world
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if (down && Math.hypot(e.clientX-down[0],e.clientY-down[1])<5) newWorld();
  down=null;
});
addEventListener('keydown',e=>{ if (e.code==='Space'){ e.preventDefault(); newWorld(); } });

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

// --- loop ---
const clock = new THREE.Clock(), q = new THREE.Quaternion();
const toLocal = (mesh,v) => v.clone().applyQuaternion(mesh.getWorldQuaternion(q).invert());
const tmp = new THREE.Vector3();
function lightBody(mesh, sunW){
  const u = mesh.material.uniforms;
  u.uSun.value.copy(toLocal(mesh,sunW));
  u.uCam.value.copy(mesh.worldToLocal(camera.position.clone()));
  u.uSunCol.value.copy(sunCol);
  u.uTime.value = clock.elapsedTime;
}
renderer.setAnimationLoop(()=>{
  const dt = clock.getDelta(), time = clock.elapsedTime;
  planet.rotation.y += dt*(planetMat.uniforms.uGas.value ? .12 : .05);
  clouds.rotation.y += dt*.065;
  starMesh.rotation.y += dt*.03;
  for (const m of moons){ m.pivot.rotation.y += dt*m.speed; m.mesh.rotation.y += dt*.1; }
  controls.update();
  tilt.updateMatrixWorld();
  halo.quaternion.copy(camera.quaternion);
  lightBody(planet, SUN);
  // around a star, light comes from the centre; otherwise from the distant sun
  for (const m of moons) lightBody(m.mesh, mode==='star' ? m.mesh.getWorldPosition(tmp).negate().normalize() : SUN);
  starMat.uniforms.uTime.value = time;
  starMat.uniforms.uCam.value.copy(starMesh.worldToLocal(camera.position.clone()));
  diskMat.uniforms.uTime.value = time;
  cloudMat.uniforms.uSun.value.copy(toLocal(clouds,SUN));
  cloudMat.uniforms.uSunCol.value.copy(sunCol);
  cloudMat.uniforms.uTime.value = time;
  atmoMat.uniforms.uSunW.value.copy(SUN); atmoMat.uniforms.uSunCol.value.copy(sunCol);
  ringMat.uniforms.uSunW.value.copy(SUN); ringMat.uniforms.uSunCol.value.copy(sunCol);
  renderer.render(scene,camera);
});
</script>
</body>
</html>
